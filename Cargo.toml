[package]
name = "halfguru"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.48", features = ["full"] }
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
tempfile = "3.25"
